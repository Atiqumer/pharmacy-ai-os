[project]
name = "rxos-backend"
version = "2.0.0"
description = "AI-powered pharmacy operating system backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas",
    "python-multipart",
    "groq",
    "python-dotenv",
    "psycopg2-binary",
    "pyjwt",
    "sqlparse",
    "slowapi",
    "email-validator",
    "alembic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a migrated PostgreSQL database",
]
