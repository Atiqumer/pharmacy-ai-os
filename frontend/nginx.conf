server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
